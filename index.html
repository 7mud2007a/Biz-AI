<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizAI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

:root{
--bg:#050507;
--text:#f5f5f7;
--muted:#8d8d96;
--purple:#9b6cff;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 50% -15%,#3a216c,transparent 35%),
radial-gradient(circle at 100% 45%,#21143b,transparent 25%),
#050507;
color:var(--text);
font-family:
"SF Pro Display",
"SF Pro Text",
"SF Arabic",
"Noto Sans Arabic",
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
Arial,
sans-serif;
}

.container{
width:min(92%,1080px);
margin:auto;
}

nav{
height:80px;
display:flex;
align-items:center;
justify-content:space-between;
}

.logo{
font-size:25px;
font-weight:700;
letter-spacing:-1px;
}

.logo span{
color:#a77aff;
}

.nav-actions{
display:flex;
gap:8px;
align-items:center;
}

.glass{
color:white;
border:1px solid rgba(255,255,255,.13);
background:linear-gradient(
180deg,
rgba(255,255,255,.12),
rgba(255,255,255,.04)
);
backdrop-filter:blur(25px) saturate(150%);
-webkit-backdrop-filter:blur(25px) saturate(150%);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.1),
0 10px 35px rgba(0,0,0,.25);
font-family:inherit;
cursor:pointer;
}

.navbtn{
padding:10px 16px;
border-radius:14px;
font-size:14px;
}

.lang{
position:relative;
}

.langbtn{
padding:10px 14px;
border-radius:14px;
font-size:13px;
}

.langmenu{
display:none;
position:absolute;
top:52px;
right:0;
width:140px;
padding:7px;
border-radius:18px;
background:rgba(25,25,31,.85);
border:1px solid rgba(255,255,255,.13);
backdrop-filter:blur(30px);
-webkit-backdrop-filter:blur(30px);
z-index:100;
}

.langmenu.show{
display:block;
}

.langoption{
width:100%;
padding:11px;
border:0;
border-radius:12px;
background:transparent;
color:#ddd;
font-family:inherit;
text-align:start;
cursor:pointer;
}

.langoption:hover,
.langoption.active{
background:rgba(155,108,255,.15);
color:#b99aff;
}

/* HERO */

.hero{
text-align:center;
padding:70px 0 55px;
}

.badge{
display:inline-block;
padding:9px 15px;
border-radius:100px;
font-size:13px;
color:#c5aaff;
background:rgba(155,108,255,.08);
border:1px solid rgba(155,108,255,.2);
backdrop-filter:blur(20px);
}

h1{
margin:22px auto 18px;
font-size:clamp(43px,8vw,72px);
line-height:1.05;
letter-spacing:-3px;
}

.gradient{
background:linear-gradient(
110deg,
#fff,
#d4c0ff,
#9866ff
);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.hero p{
max-width:620px;
margin:auto;
color:var(--muted);
font-size:16px;
line-height:1.8;
}

/* GENERATOR */

.generator{
margin:20px 0 70px;
padding:25px;
border-radius:30px;
background:linear-gradient(
145deg,
rgba(255,255,255,.09),
rgba(255,255,255,.035)
);
border:1px solid rgba(255,255,255,.12);
backdrop-filter:blur(30px) saturate(150%);
-webkit-backdrop-filter:blur(30px) saturate(150%);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.1),
0 25px 70px rgba(0,0,0,.3);
}

.generator h2{
margin:0 0 7px;
font-size:24px;
}

.generator-desc{
margin:0 0 25px;
color:#777780;
font-size:14px;
}

/* FORM */

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.field{
display:flex;
flex-direction:column;
gap:8px;
}

.field.full{
grid-column:1/-1;
}

label{
font-size:13px;
color:#aaaab2;
}

select,
textarea{
width:100%;
border:1px solid rgba(255,255,255,.1);
outline:none;
border-radius:17px;
background:rgba(0,0,0,.22);
color:white;
padding:14px;
font-family:inherit;
font-size:14px;
}

select option{
background:#17171c;
color:white;
}

textarea{
min-height:135px;
resize:vertical;
line-height:1.7;
}

textarea::placeholder{
color:#606068;
}

.generate{
width:100%;
margin-top:15px;
padding:15px;
border-radius:17px;
font-size:15px;
font-weight:600;
background:linear-gradient(
180deg,
rgba(174,139,255,.58),
rgba(103,57,190,.4)
);
}

.generate:disabled{
opacity:.55;
cursor:not-allowed;
}

/* RESULT */

.loading{
display:none;
text-align:center;
padding:20px;
color:#a98aff;
font-size:13px;
}

.resultbox{
display:none;
margin-top:18px;
padding:20px;
border-radius:20px;
background:rgba(0,0,0,.2);
border:1px solid rgba(255,255,255,.08);
}

.resulttop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.resulttop strong{
font-size:14px;
}

.copy{
padding:8px 12px;
border-radius:11px;
font-size:12px;
}

.result{
white-space:pre-wrap;
line-height:1.85;
font-size:14px;
color:#ddd;
}

.error{
color:#ff929d;
}

/* FOOTER */

footer{
border-top:1px solid rgba(255,255,255,.07);
margin-top:70px;
padding:35px 0 45px;
text-align:center;
font-size:12px;
color:#66666f;
}

.footerbrand{
color:#aaa;
font-weight:600;
margin-bottom:7px;
}

/* MOBILE */

@media(max-width:700px){

.container{
width:90%;
}

nav{
height:72px;
}

.navbtn{
padding:9px 13px;
}

.langbtn{
padding:9px 11px;
}

.hero{
padding:55px 0 45px;
}

h1{
font-size:45px;
letter-spacing:-2.5px;
}

.hero p{
font-size:15px;
}

.generator{
padding:18px;
border-radius:25px;
}

.formgrid{
grid-template-columns:1fr;
}

.field.full{
grid-column:auto;
}

}
</style>
</head>

<body>

<div class="container">

<nav>

<div class="logo">
Biz<span>AI</span>
</div>

<div class="nav-actions">

<div class="lang">

<button
class="glass langbtn"
onclick="toggleLang()"
id="langBtn">
العربية
</button>

<div
class="langmenu"
id="langMenu">

<button
class="langoption active"
onclick="setLang('ar')"
id="arOption">
العربية
</button>

<button
class="langoption"
onclick="setLang('en')"
id="enOption">
English
</button>

</div>

</div>

<button
class="glass navbtn"
onclick="goGenerator()"
id="navStart">
ابدأ الآن
</button>

</div>

</nav>

<section class="hero">

<div class="badge" id="badge">
مساعد الأعمال الذكي
</div>

<h1 id="heroTitle">
اصنع محتواك <span class="gradient">بذكاء</span>
</h1>

<p id="heroText">
أنشئ محتوى احترافي لمشروعك خلال ثوانٍ باستخدام الذكاء الاصطناعي.
</p>

</section>

<section
class="generator"
id="generator">

<h2 id="generatorTitle">
مولّد المحتوى
</h2>

<p
class="generator-desc"
id="generatorDesc">
حدد احتياجاتك وسيقوم BizAI بإنشاء المحتوى المناسب لك.
</p>

<div class="formgrid">

<div class="field">

<label id="platformLabel">
المنصة
</label>

<select id="platform">

<option value="Instagram">Instagram</option>
<option value="TikTok">TikTok</option>
<option value="Facebook">Facebook</option>
<option value="LinkedIn">LinkedIn</option>
<option value="X">X</option>

</select>

</div>

<div class="field">

<label id="typeLabel">
نوع المحتوى
</label>

<select id="type">

<option value="Posts">منشورات</option>
<option value="Captions">كابشن</option>
<option value="Ads">إعلانات</option>
<option value="Video Scripts">سكريبت فيديو</option>
<option value="Product Description">وصف منتج</option>

</select>

</div>

<div class="field">

<label id="toneLabel">
نبرة الكتابة
</label>

<select id="tone">

<option value="Professional">احترافية</option>
<option value="Friendly">ودية</option>
<option value="Luxury">فاخرة</option>
<option value="Persuasive">إقناعية</option>
<option value="Simple">بسيطة</option>

</select>

</div>

<div class="field">

<label id="languageLabel">
لغة المحتوى
</label>

<select id="contentLanguage">

<option value="Arabic">العربية</option>
<option value="English">English</option>

</select>

</div>

<div class="field">

<label id="countLabel">
عدد النتائج
</label>

<select id="count">

<option value="1">1</option>
<option value="3">3</option>
<option value="5">5</option>
<option value="10">10</option>

</select>

</div>

<div class="field full">

<label id="detailsLabel">
تفاصيل المحتوى
</label>

<textarea
id="prompt"
placeholder="مثال: عندي متجر ملابس رجالية وأريد منشورات تجذب العملاء في ألمانيا...">
</textarea>

</div>

</div>

<button
class="glass generate"
onclick="generateContent()"
id="generateBtn">
إنشاء المحتوى
</button>

<div
class="loading"
id="loading">
جاري إنشاء المحتوى...
</div>

<div
class="resultbox"
id="resultBox">

<div class="resulttop">

<strong id="resultTitle">
النتيجة
</strong>

<button
class="glass copy"
onclick="copyResult()"
id="copyBtn">
نسخ
</button>

</div>

<div
class="result"
id="result">
</div>

</div>

</section>

<footer>

<div class="footerbrand">
BizAI
</div>

<div id="copyright">
© 2026 BizAI — جميع الحقوق محفوظة.
</div>

</footer>

</div>

<script>

const T={

ar:{
lang:"العربية",
nav:"ابدأ الآن",
badge:"مساعد الأعمال الذكي",
hero:"اصنع محتواك <span class='gradient'>بذكاء</span>",
heroText:"أنشئ محتوى احترافي لمشروعك خلال ثوانٍ باستخدام الذكاء الاصطناعي.",
title:"مولّد المحتوى",
desc:"حدد احتياجاتك وسيقوم BizAI بإنشاء المحتوى المناسب لك.",
platform:"المنصة",
type:"نوع المحتوى",
tone:"نبرة الكتابة",
language:"لغة المحتوى",
count:"عدد النتائج",
details:"تفاصيل المحتوى",
placeholder:"مثال: عندي متجر ملابس رجالية وأريد منشورات تجذب العملاء في ألمانيا...",
generate:"إنشاء المحتوى",
loading:"جاري إنشاء المحتوى...",
result:"النتيجة",
copy:"نسخ",
copied:"تم النسخ",
copyright:"© 2026 BizAI — جميع الحقوق محفوظة."
},

en:{
lang:"English",
nav:"Get Started",
badge:"Your AI Business Assistant",
hero:"Create content <span class='gradient'>smarter</span>",
heroText:"Create professional content for your business in seconds using AI.",
title:"AI Content Generator",
desc:"Choose your preferences and BizAI will create the right content for you.",
platform:"Platform",
type:"Content Type",
tone:"Writing Tone",
language:"Content Language",
count:"Number of Results",
details:"Content Details",
placeholder:"Example: I own a men's clothing store and want posts that attract customers in Germany...",
generate:"Generate Content",
loading:"Creating your content...",
result:"Result",
copy:"Copy",
copied:"Copied",
copyright:"© 2026 BizAI — All rights reserved."
}

};

function toggleLang(){

document
.getElementById("langMenu")
.classList.toggle("show");

}

function setLang(lang){

const t=T[lang];

document.documentElement.lang=lang;
document.documentElement.dir=
lang==="ar"?"rtl":"ltr";

document.getElementById("langBtn").textContent=t.lang;
document.getElementById("navStart").textContent=t.nav;
document.getElementById("badge").textContent=t.badge;
document.getElementById("heroTitle").innerHTML=t.hero;
document.getElementById("heroText").textContent=t.heroText;

document.getElementById("generatorTitle").textContent=t.title;
document.getElementById("generatorDesc").textContent=t.desc;

document.getElementById("platformLabel").textContent=t.platform;
document.getElementById("typeLabel").textContent=t.type;
document.getElementById("toneLabel").textContent=t.tone;
document.getElementById("languageLabel").textContent=t.language;
document.getElementById("countLabel").textContent=t.count;
document.getElementById("detailsLabel").textContent=t.details;

document.getElementById("prompt").placeholder=t.placeholder;
document.getElementById("generateBtn").textContent=t.generate;
document.getElementById("loading").textContent=t.loading;
document.getElementById("resultTitle").textContent=t.result;
document.getElementById("copyBtn").textContent=t.copy;
document.getElementById("copyright").textContent=t.copyright;

document
.getElementById("arOption")
.classList.toggle(
"active",
lang==="ar"
);

document
.getElementById("enOption")
.classList.toggle(
"active",
lang==="en"
);

document
.getElementById("langMenu")
.classList.remove("show");

localStorage.setItem(
"bizai-language",
lang
);

}

function goGenerator(){

document
.getElementById("generator")
.scrollIntoView({
behavior:"smooth"
});

}

async function generateContent(){

const details=
document
.getElementById("prompt")
.value
.trim();

const resultBox=
document.getElementById("resultBox");

const result=
document.getElementById("result");

const loading=
document.getElementById("loading");

const button=
document.getElementById("generateBtn");

const lang=
document.documentElement.lang;

if(!details){

resultBox.style.display="block";

result.className="result error";

result.textContent=
lang==="en"
?"Please enter your content details first."
:"اكتب تفاصيل المحتوى أولاً.";

return;

}

const platform=
document.getElementById("platform").value;

const type=
document.getElementById("type").value;

const tone=
document.getElementById("tone").value;

const contentLanguage=
document.getElementById("contentLanguage").value;

const count=
document.getElementById("count").value;

const finalPrompt=`

Create ${count} ${type}
for ${platform}.

Writing tone:
${tone}

Content language:
${contentLanguage}

User's business/details:
${details}

IMPORTANT:

Return ONLY the finished content.

Do not add explanations.

Do not add marketing notes.

Do not say "here is your content".

Do not add a "BizAI note".

Do not use emojis unless specifically requested.

Make every result ready to copy and publish.

`;

resultBox.style.display="none";
loading.style.display="block";
button.disabled=true;

try{

const response=
await fetch(
"/api/generate",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
prompt:finalPrompt
})

});

const data=
await response.json();

if(!response.ok){

throw new Error(
data.error ||
"Request failed"
);

}

result.textContent=data.result;
result.className="result";
resultBox.style.display="block";

}catch(error){

result.className="result error";

result.textContent=
lang==="en"
?"Something went wrong: "+error.message
:"حدث خطأ: "+error.message;

resultBox.style.display="block";

}finally{

loading.style.display="none";
button.disabled=false;

}

}

async function copyResult(){

const text=
document
.getElementById("result")
.textContent;

if(!text)return;

try{

await navigator.clipboard.writeText(text);

}catch{

const area=document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

}

const btn=
document.getElementById("copyBtn");

const lang=
document.documentElement.lang;

btn.textContent=
lang==="en"
?"Copied"
:"تم النسخ";

setTimeout(()=>{

btn.textContent=
lang==="en"
?"Copy"
:"نسخ";

},1500);

}

document.addEventListener(
"click",
function(e){

const lang=
document.querySelector(".lang");

if(!lang.contains(e.target)){

document
.getElementById("langMenu")
.classList.remove("show");

}

});

setLang(
localStorage.getItem("bizai-language") || "ar"
);

</script>

</body>
</html>
